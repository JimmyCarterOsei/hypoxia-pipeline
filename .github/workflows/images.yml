name: Images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "docker/**"
      - "pyproject.toml"
      - "src/**"
      - ".github/workflows/images.yml"

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: hypoxiapipe
            dockerfile: docker/Dockerfile.python
          - name: hypoxiapipe-r
            dockerfile: docker/Dockerfile.r

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Pull requests build but never push: a fork must not be able to publish
      # to the registry, and an unreviewed image tag is worse than no image.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - name: Build
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Smoke test
        run: |
          set -euo pipefail
          TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          if [ "${{ matrix.name }}" = "hypoxiapipe-r" ]; then
            # The worker must answer a real request with a well-formed result.
            docker run --rm -i "$TAG" < tests/fixtures/r_request.json \
              | tee /tmp/response.json | head -c 200
            python -c "
          import json, sys
          payload = json.load(open('/tmp/response.json'))
          assert payload['ok'] is True, payload
          result = payload['results'][0]
          assert result['n'] == 120 and result['hr'] > 1, result
          print('R worker OK: HR', round(result['hr'], 3))
          "
          else
            docker run --rm "$TAG" sig list
            docker run --rm "$TAG" cohort list
          fi

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}

      - name: Record the published digest
        if: github.event_name != 'pull_request'
        run: |
          echo "### ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo '`${{ steps.build.outputs.digest }}`' >> "$GITHUB_STEP_SUMMARY"

  integration:
    # Proves the two images actually compose: the Python stage reaches the R
    # stage over the JSON contract, with no shared filesystem or service.
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: pip install -e ".[dev]"
      - name: Cross-container survival call
        env:
          HYPOXIAPIPE_R_COMMAND: >-
            docker run --rm -i
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/hypoxiapipe-r:sha-${{ github.sha }}
        run: |
          python -c "
          import json
          from hypoxiapipe.modeling import cox, r_available
          assert r_available()
          request = json.load(open('tests/fixtures/r_request.json'))
          results = cox(request['time'], request['event'], request['scores'])
          print('cross-container HR:', round(results[0].hr, 3))
          assert results[0].n == 120
          "

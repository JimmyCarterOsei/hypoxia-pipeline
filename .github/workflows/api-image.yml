name: Frozen model API image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/api-image.yml"
      - "docker/Dockerfile.api"
      - "models/prad-bcr-star-smith20-cox-v1/**"
      - "src/**"
      - "pyproject.toml"
      - "README.md"
      - "scripts/demo_model_api.py"
      - "tests/fixtures/prad_bcr_star_v1_known_sample.json"

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Resolve immutable Python base for this build
        id: base
        shell: bash
        run: |
          set -euo pipefail
          BASE_REF=python:3.12-slim-bookworm
          BASE_DIGEST="$(docker buildx imagetools inspect "$BASE_REF" | awk '$1 == "Digest:" {print $2; exit}')"
          test -n "$BASE_DIGEST"
          echo "reference=$BASE_REF@$BASE_DIGEST" >> "$GITHUB_OUTPUT"
          echo "Python base: $BASE_REF@$BASE_DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Build inference-only image
        shell: bash
        run: |
          set -euo pipefail
          SOFTWARE_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          docker buildx build --load \
            --cache-from type=gha,scope=hypoxiapipe-api \
            --cache-to type=gha,mode=max,scope=hypoxiapipe-api \
            --build-arg PYTHON_IMAGE='${{ steps.base.outputs.reference }}' \
            --build-arg GIT_SHA='${{ github.sha }}' \
            --build-arg IMAGE_TAG='sha-${{ github.sha }}' \
            --build-arg SOFTWARE_VERSION="$SOFTWARE_VERSION" \
            -f docker/Dockerfile.api \
            -t 'hypoxiapipe-api:${{ github.sha }}' .

      - name: Live container smoke and known-prediction regression
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -d --name hypoxiapipe-api-smoke \
            -p 127.0.0.1:8000:8000 'hypoxiapipe-api:${{ github.sha }}'
          trap 'docker logs hypoxiapipe-api-smoke || true; docker stop hypoxiapipe-api-smoke || true' EXIT
          python3 scripts/demo_model_api.py --known-fixture --url http://127.0.0.1:8000
          docker image inspect 'hypoxiapipe-api:${{ github.sha }}' \
            --format 'Image ID: {{.Id}}; labels: {{json .Config.Labels}}' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish verified image
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE="ghcr.io/$OWNER_LC/hypoxiapipe-api:sha-${GITHUB_SHA}"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "hypoxiapipe-api:${GITHUB_SHA}" "$IMAGE"
          docker push "$IMAGE"
          docker image inspect "$IMAGE" --format '{{json .RepoDigests}}' >> "$GITHUB_STEP_SUMMARY"

name: Cambridge
source: geo
accession: GSE70768
platform: GPL10558          # Illumina HumanHT-12 V4.0 - matrix is probe-indexed
symbol_authority: "2024-07-01"
collapse_rule: max_mean
multi_probe_rule: drop
log2_transform: null        # null = infer from the observed value range

# Column names confirmed against the real series matrix on 2026-09-01 via
# 'hypoxiapipe cohort inspect cambridge'. GEO characteristic keys are derived
# from submitter free text, so they cannot be guessed - these are verbatim.
#
# The series holds 199 samples, not 199 primary tumours: benign comparison
# tissue and castrate-resistant (CRPC) samples are deposited alongside. Both
# must go before scoring. Benign tissue widens every gene's dynamic range,
# which shifts the cohort-relative z-scores of the tumours; CRPC is a different
# disease state whose recurrence endpoint does not mean the same thing.
sample_filters:
  - column: sample_type
    keep: [Tumour]
  - column: title
    drop_contains: [CRPC]

endpoint:
  name: BCR (5-year capped)
  time_column: time_to_bcr_(months)
  # Patients who never relapsed have no time-to-BCR; their follow-up is here.
  # Without this, every censored patient is dropped as unusable and the cohort
  # comes through with a ~100% event rate - which reads as a small cohort
  # rather than a broken one.
  censored_time_column: total_follow_up_(months)
  event_column: biochemical_relapse_(bcr)
  time_unit: months
  event_values: ["y", "yes", "1"]
  censor_values: ["n", "no", "0"]
  cap_months: 60

# Verified build, 2026-09-01: 111 samples, 19 events after filtering,
# endpoint derivation and analysis-set restriction.
expect:
  n_samples: 111
  min_genes: 10000

notes: >
  Cambridge prostate cohort (Ross-Adams 2015). n_samples is pinned to a verified
  build, so a re-deposited series fails the build rather than shifting every
  number.
  Samples with 'N/A' for relapse or time drop out at the analysis-set step and
  are counted in the endpoint report.

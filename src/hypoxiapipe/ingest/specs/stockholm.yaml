name: Stockholm
source: geo
accession: GSE70769
platform: GPL10558          # Illumina HumanHT-12 V4.0 - matrix is probe-indexed
symbol_authority: "2024-07-01"
collapse_rule: max_mean
multi_probe_rule: drop
log2_transform: null        # null = infer from the observed value range

# Column names confirmed against the real series matrix on 2026-09-01 via
# 'hypoxiapipe cohort inspect stockholm'. Verbatim - GEO characteristic keys
# come from submitter free text and cannot be guessed.
#
# Unlike Cambridge (same publication, same platform), this series deposits
# only primary tumours: 94 samples, all robotic radical prostatectomy, with no
# sample_type column at all. Its other keys differ too - here
# 'extra_capsular_extension_(ece)' with an underscore where Cambridge has a
# hyphen. Same submitters, one paper, different spellings; this is why the
# columns are declared per cohort rather than shared.
#
# The CRPC guard is kept as a cheap assertion: it drops nothing today, and
# reports a non-zero count if a future re-deposit adds advanced-disease
# samples to the series.
sample_filters:
  - column: title
    drop_contains: [CRPC]

endpoint:
  name: BCR (5-year capped)
  time_column: time_to_bcr_(months)
  event_column: biochemical_relapse_(bcr)
  time_unit: months
  event_values: ["y", "yes", "1"]
  censor_values: ["n", "no", "0"]
  cap_months: 60

expect:
  min_genes: 10000

notes: >
  Stockholm prostate cohort (Ross-Adams 2015), same platform as Cambridge.
  Sample count intentionally unpinned until a verified build: pin expect.n_samples once you have one, so
  a re-deposited series fails the build rather than shifting every number.
  Samples with 'N/A' for relapse or time drop out at the analysis-set step and
  are counted in the endpoint report.
